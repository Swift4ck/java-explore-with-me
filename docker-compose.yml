services:
  stats-server:
    build: stats_parent/stats-service
    image: explore-with-me-stats-parent
    container_name: stats-parent
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: stats
      SPRING_DATASOURCE_PASSWORD: stats
    depends_on:
      - stats-db

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
    volumes:
      - stats-db-data:/var/lib/postgresql/data

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    environment:
      POSTGRES_DB: ewm          #Имя бд
      POSTGRES_USER: ewm        #Пользователь
      POSTGRES_PASSWORD: ewm    #Пароль
    volumes:
      - ewm-db-data:/var/lib/postgresql/data #куда сохраняем данные на диске
    ports:
      - "5433:5432"

  ewm-service:
    build: main_svc #где находится dockerfile
    container_name: ewm-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm

    depends_on:
      - ewm-db

volumes:
  stats-db-data:
  ewm-db-data:

